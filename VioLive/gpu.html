<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VioLive (WebGPU)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
               font: 15px/1.35 -apple-system, system-ui, sans-serif; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #gate button { font: 32px -apple-system, system-ui; padding: 24px 48px; border-radius: 16px; border: 0;
                 background: #2f7df6; color: #fff; }
</style>
</head>
<body>
<!-- VioLive on the shared app stack (VioLiveApp.cc): Entry + WebGPU + ImGui draw everything into
     #canvas; gpu_feed.js pushes the sensors / ?replay=. Needs WebGPU and JSPI (Chrome/Edge 137+,
     Safari 27+) and cross-origin isolation (tests/web/serve.py, or coi_sw.js on a static host). -->
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="gate"></div>
<script>
  if (!self.crossOriginIsolated && 'serviceWorker' in navigator && !sessionStorage.coiReloaded) {
    sessionStorage.coiReloaded = '1';
    navigator.serviceWorker.register('coi_sw.js').then(() => location.reload());
  }
</script>
<script src="gpu_feed.js"></script>
<script type="module">
  const gate = document.getElementById('gate');
  const jspi = typeof WebAssembly === 'object' && 'Suspending' in WebAssembly;
  const load = async () => {
    gate.remove();
    // As shell.html.in: SDL sizes its window from the canvas's INLINE style, not the stylesheet
    // (a stylesheet-only size leaves the window 0x0 and the main loop never renders).
    const canvas = document.getElementById('canvas');
    canvas.style.width = `${window.innerWidth}px`;
    canvas.style.height = `${window.innerHeight}px`;
    (await import('./VioLiveApp.js')).default();
  };
  if (!jspi || !navigator.gpu) {
    gate.textContent = 'This page needs WebGPU and JSPI (Chrome/Edge 137+, Safari 27+): use index.html.';
  } else if (new URLSearchParams(location.search).get('autostart')) {
    load();
  } else {
    // A tap first: iOS asks for motion permission only inside a user gesture.
    const b = document.createElement('button');
    b.textContent = 'VioLive';
    b.onclick = async () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
        await DeviceMotionEvent.requestPermission().catch(() => {});
      load();
    };
    gate.append(b);
  }
</script>
</body>
</html>
